<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up Form</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="right-side-panel">
    <div class="right-side-logo">
      <img src="./img/odin-lined.png">
      <p>ODIN</p>
    </div>
  </div>

  <div class="left-side-panel">
    
    <div class="left-side-panel-para">
      <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
      <p>Sign up <em>now </em>to get started.</p>

      <p>You <em>know</em> you want to.</p>
    </div>

    <form>
      <div class="left-panel-form-container">
        <h2>Let's do this!</h2>
        
        <div class="left-panel-input-container">
          <div class="left-panel-input">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" maxlength="48">
          </div>
        
          <div class="left-panel-input">
            <label for="last_name">Last name</label>
            <input type="text" id="first_name" maxlength="48">
          </div>

          <div class="left-panel-input">
            <label for="last_name">Email</label>
            <input type="email" id="first_name">
          </div>
          
          <div class="left-panel-input">
            <label for="last_name">Phone Number</label>
            <input type="text" id="first_name">
          </div>

          <div class="left-panel-input">
            <label for="user_password">Password</label>
            <input type="password" id="user_password" minlength="8">
          </div>
          
          <div class="left-panel-input">
            <label for="user_confirm_password">Confirm Password</label>
            <input type="password" id="user_confirm_password" minlength="8">
          </div>
        </div>
        
      </div>

      <div class="left-panel-form-action">
        <button>Create Account</button>
        <p>Already have an account? <a href=".">Log in</a></p>
      </div>
      
    </form>
    
  </div>
</body>
</html>
